# Local verification stack: a throwaway Postgres 16 plus PostgREST, configured
# like a Supabase project (roles anon / authenticated / service_role, JWT auth,
# only fn_app and fn_analytics exposed). Nothing here is used in production.
#
#   docker compose -f docker-compose.local.yml up -d
#   npm run db:apply          # roles + schema + seed + reset, each twice
#   npm run test:db           # integration tests against the real SQL
#   docker compose -f docker-compose.local.yml down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: postgrest/postgrest
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:local-only-password@db:5432/postgres
      PGRST_DB_SCHEMAS: fn_app,fn_analytics
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-only-jwt-secret-with-at-least-32-characters
      PGRST_DB_MAX_ROWS: "1000"
    ports:
      - "54330:3000"
